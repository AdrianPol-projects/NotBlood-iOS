---
name: iOS IPA build

'on':
  push:
    branches: [ios]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL2_VERSION: 2.32.10
  GL4ES_COMMIT: ec16bedd8819c475326f4f1a3063772c6d986e06

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Fetch SDL2
        run: |
          curl -fsSL -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          mkdir -p third_party
          tar xzf sdl2.tar.gz -C third_party

      - name: Fetch gl4es
        run: |
          curl -fsSL -o gl4es.tar.gz "https://github.com/ptitSeb/gl4es/archive/${GL4ES_COMMIT}.tar.gz"
          mkdir -p third_party
          tar xzf gl4es.tar.gz -C third_party

      - name: Configure
        run: |
          cmake -S platform/iOS -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSDL2_SOURCE_DIR="$PWD/third_party/SDL2-${SDL2_VERSION}" \
            -DGL4ES_SOURCE_DIR="$PWD/third_party/gl4es-${GL4ES_COMMIT}" \
            -DNOTBLOOD_BUILD=${{ github.run_number }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-ios --config Release --target NotBlood -- \
            -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build-ios -type d -name NotBlood.app -path '*Release-iphoneos*' | head -n 1)
          test -n "$APP" || { echo "NotBlood.app not found"; exit 1; }
          echo "App bundle: $APP"
          ls -la "$APP"
          plutil -p "$APP/Info.plist"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../NotBlood.ipa Payload)
          ls -la NotBlood.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NotBlood-ios-${{ github.run_number }}
          path: NotBlood.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish to "ios-latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs can be queued late; never let an older commit replace a newer IPA.
          HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" -q .sha)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch head is $HEAD_SHA, this run built $GITHUB_SHA - not publishing."
            exit 0
          fi
          TITLE="NotBlood for iPad (build ${{ github.run_number }})"
          NOTES="Unsigned IPA built from ${GITHUB_SHA}. Sign/sideload with Signulous, Sideloadly or AltStore. Copy your Blood files to Files > On My iPad > NotBlood. See platform/iOS/README.md."
          # Replace the asset in place so the release is never left empty.
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest NotBlood.ipa --clobber
            gh release edit ios-latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create ios-latest NotBlood.ipa --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
